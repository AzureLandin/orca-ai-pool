# orca-ai-pool 公网入口（单文件 nginx 配置）
#
# 部署形态：docker compose 里的 nginx 服务，监听 8317（公网），反代到内网
# cliproxyapi:8317。CPA 自身端口在宿主机上只绑 127.0.0.1:18317（调试用）。
#
# 设计原则：**只防管理面的口令爆破，不限制实际模型调用。**
# CPAMC 管理口按设计对公网开放，所以只对管理/面板路径按 IP 限速：
#   * /v0/management/* 管理 API：按 IP 10 r/min + burst 5
#   * /management*     CPAMC 登录页/静态资源：与上面共用同一限速桶（burst 10）
#   * /v1/*            LLM 调用：**不限速、不限并发**，只做透明反代（SSE 直通）
# 并发上限只压在管理面上（每 IP 32 条），业务/流式连接不设上限，避免长会话被误杀。
#
# 调优：直接改下面的 rate/burst，然后 `docker compose restart ingress`（服务名是 ingress）。
# 不想按 IP 限速而是想整体限速时，把 limit_req_zone 的 key 换成 $server_name。

worker_processes auto;
# 容器里写 stderr 即可被 `docker compose logs` 收集
error_log stderr warn;
pid /tmp/orca-nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # 不 include mime.types：入口只做反代，不提供静态文件
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    # 临时文件放 /tmp 下一级目录：nginx 只 mkdir 一层，多级路径在父目录
    # 不存在时会 emerg；放 /tmp 也让任意机器上 `nginx -t` 能直接校验
    client_body_temp_path /tmp/orca-body;
    proxy_temp_path       /tmp/orca-proxy;
    fastcgi_temp_path     /tmp/orca-fastcgi;
    uwsgi_temp_path       /tmp/orca-uwsgi;
    scgi_temp_path        /tmp/orca-scgi;

    sendfile on;
    tcp_nodelay on;

    # 上下文可能很长（大仓库 + 长 history），给足余量
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    # 只记录方法/URI/状态，绝不记录 Authorization 头
    log_format orca '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout orca;

    # ---- 限速/限连 zone（仅管理面） --------------------------------------
    # 故意不定义 /v1 的 zone：模型调用路径不参与任何计数。
    # 管理面也**不按路径分桶**——所有管理入口共用 orca_admin 一个桶，
    # 否则打 /management 再打 /v0/management 就能各自拿到一份 burst。
    limit_req_zone  $binary_remote_addr zone=orca_admin:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=orca_admin_conn:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # 上游 CPA：用变量 + resolver 让 nginx 启动不依赖 CPA 已就绪
    # （docker 内置 DNS 是 127.0.0.11；换成宿主机 nginx 时改成 127.0.0.53 或删掉 resolver 段）
    resolver 127.0.0.11 valid=10s ipv6=off;


    server {
        listen 8317 default_server;
        listen [::]:8317 default_server;

        set $cpa cliproxyapi:8317;

        # 429 统一返回 JSON，OpenAI 兼容客户端能识别并退避
        error_page 429 = @too_many;

        # ---- 客户端 LLM 接口：不限速 ------------------------------------
        # 这里刻意没有任何 limit_req / limit_conn：实际模型调用的速率由上游
        # 账号额度与 CPA 的会话亲和/冷却负责，入口不参与限流。
        location /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式输出：必须关缓冲并拉长超时
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            proxy_pass http://$cpa;
        }

        # ---- 管理 API（CPAMC 预期公网可达，仅此处按 IP 限速） -----------
        # 10 r/min + burst 5：够 poolctl quota 这类正常运维（每次几条请求），
        # 但口令爆破只能做到 ~0.17 次/秒/ IP，且共用 orca_admin 桶。
        location /v0/ {
            limit_req  zone=orca_admin burst=5 nodelay;
            limit_conn orca_admin_conn 32;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;

            # 想再收紧一层时启用（需自己生成 htpasswd 并挂载）：
            # auth_basic "orca admin";
            # auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://$cpa;
        }

        # ---- CPAMC 面板（登录页 / 静态资源） ----------------------------
        location /management {
            limit_req  zone=orca_admin burst=10 nodelay;
            limit_conn orca_admin_conn 32;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;

            proxy_pass http://$cpa;
        }

        # ---- 其余路径（管理入口兜底） -----------------------------------
        # 只到得了这里的管理类路径才受限；/v1 有独立 location，不会被波及。
        location / {
            limit_req  zone=orca_admin burst=5 nodelay;
            limit_conn orca_admin_conn 32;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;

            proxy_pass http://$cpa;
        }

        # 管理面 429：管理工具（含 poolctl）能看懂，普通 LLM 客户端不会走到这里
        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"message":"management endpoint rate limited by orca-ai-pool ingress","type":"rate_limit_exceeded","code":"rate_limit_exceeded"}}';
        }
    }
}

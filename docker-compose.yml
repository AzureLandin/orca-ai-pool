# orca-ai-pool — CPA(CLIProxyAPI) 主网关 + opencode2api 副网关
#
# 拓扑：
#   本地 Orca ──> nginx:8317 ──> cliproxyapi:18317 ──┬─> Devin (OAuth, 原生 provider)
#                                   ├─> opencode2api:8080 (内网) ──> OpenCode Go
#                                   └─> command-code-goat (GOAT 直连, 公网)
#
# 关键约束：
#   * opencode2api 的 8080 API 端口【不发布】到宿主机，只在 orca-net 内被 cliproxyapi
#     以 http://opencode2api:8080/v1 访问；WebUI 仅绑定 127.0.0.1:18081，请用 SSH 隧道访问。
#   * opencode2api 的 config.json 只会在 **首次启动**（state 卷为空时）从 CONFIG_SEED_PATH
#     导入一次。之后修改配置必须：
#       poolctl render                # 生成最新的 opencode2api/config.json
#       docker compose cp opencode2api/config.json opencode2api:/run/config/opencode2api.json
#       # 然后由 WebUI 或管理 API 触发 reload（poolctl render 在容器运行时自动完成这两步）
#     直接编辑宿主机的 config.json 再 restart 容器是【无效】的，state 卷里的旧配置会覆盖种子。
#   * CPA 侧（cliproxy/config.yaml 与 cliproxy/auths/*.json）为挂载文件，改动后自动热载，无需重启。

services:
  opencode2api:
    image: ghcr.io/jasonxu114514/opencode2api:latest
    container_name: opencode2api
    restart: unless-stopped
    # 8080 为 API（仅供内网 cliproxyapi 调用，不发布）；8081 为 WebUI，仅回环。
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      # 种子配置：仅在 state 卷首次初始化时导入一次
      - ./opencode2api/config.json:/run/config/opencode2api.json:ro
      # 运行态（含已导入的配置、会话、缓存等），必须持久化
      - opencode2api-state:/var/lib/opencode2api
    environment:
      CONFIG_SEED_PATH: /run/config/opencode2api.json
      LISTEN_ADDRESS: 0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || curl -sf http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - orca-net

  cliproxyapi:
    # 官方发布在 Docker Hub：eceasy/cli-proxy-api（ghcr.io/router-for-me/cliproxyapi 不存在/需登录）
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    restart: unless-stopped
    ports:
      # 只发布到回环：公网口 8317/443 由 nginx 前置，管理面才能被 limit_req 约束
      - "127.0.0.1:18317:18317"
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./cliproxy/auths:/root/.cli-proxy-api
      - ./cliproxy/logs:/CLIProxyAPI/logs
      # C ABI 插件目录（commandcode 余量监控插件 .so 由 poolctl install-plugin 安装）
      - ./cliproxy/plugins:/CLIProxyAPI/plugins
    depends_on:
      opencode2api:
        condition: service_started
    healthcheck:
      # 镜像内无 wget/curl，但有 bash——用 /dev/tcp 探测内部端口（仅 TCP 层连通性）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18317'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - orca-net

volumes:
  opencode2api-state:

networks:
  orca-net:
    driver: bridge
